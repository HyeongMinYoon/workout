  function render(){
    if(!S.ready){ root.innerHTML='<div class="empty">불러오는 중…</div>'; return; }
    var oldsc=root.querySelector(".scroll"), sy=oldsc?oldsc.scrollTop:0;
    var d=day(), h='';

    if(S.tab==="today"){
      var pr=dayProgress(d), rem=remDay(d), fin=pr.all>0 && pr.done>=pr.all;
      var cs=curSession(false);
      var mins=(fin && cs && cs.t0 && cs.t1) ? Math.max(1,Math.round((cs.t1-cs.t0)/6e4)) : 0;
      h+='<div class="nav">';
      if(fin && !S.focus){
        h+='<div class="kick on">'+CHK("currentColor")+'<span>'+fmtK(todayKey())
          +(mins?' · '+mins+'분 소요':'')+'</span></div>'
          +'<div class="ttl"><h1>'+esc(d.nm)+' 완료</h1></div>'
          +'<div class="sub">'+esc(d.sub)+' · '+pr.done+' / '+pr.all+' 세트</div>';
      } else {
        h+='<div class="kick">'+fmtK(todayKey())+'</div>'
          +'<div class="ttl"><h1>'+esc(d.nm)+'</h1>'
          +'<span class="prg">'+pr.done+' / '+pr.all+' 세트</span></div>'
          +'<div class="sub">'+esc(d.sub)+' · 남은 '+rem+'분</div>';
      }
      h+='<div class="seg">'+S.routine.days.map(function(x,i){
          return '<button data-act="day" data-id="'+x.id+'" data-on="'+(x.id===S.dayId?1:0)+'">'
            +(i+1)+'</button>';
        }).join("")+'</div></div>';
    } else {
      var T={prog:["진행","최근 7일"],
             log:["기록","지난 세션 로그"],
             list:["운동 목록","추천에서 뺄 종목을 끄면 된다"]}[S.tab];
      h+='<div class="nav"><div class="kick">'+T[1]+'</div>'
        +'<div class="ttl"><h1>'+T[0]+'</h1></div></div>';
    }
    h+='<div class="scroll">';
    h += (S.tab==="today"?vToday() : S.tab==="prog"?vProgress() : S.tab==="log"?vLog() : vList());
    h += '</div><div class="dock">';
    if(S.rest.on) h+=restPill();
    h+='<div class="tabbar">'+tabBtn("today","오늘")+tabBtn("prog","진행")
      +tabBtn("log","기록")+tabBtn("list","목록")+'</div></div>';
    root.innerHTML=h;
    var ns=root.querySelector(".scroll");
    if(ns) ns.scrollTop = S.resetScroll?0:sy;
    S.resetScroll=false;
    // 키패드를 열면 확인 버튼이 화면 밖으로 나갈 수 있다. 필요한 만큼만 끌어올린다.
    if(ns && S.pad){
      var pe=root.querySelector(".pad");
      if(pe){
        var dl=pe.getBoundingClientRect().bottom-ns.getBoundingClientRect().bottom+12;
        if(dl>0) ns.scrollTop+=dl;
      }
    }
    if(S.rest.on) paintRest();
  }

  root.addEventListener("click", function(ev){
    var t=ev.target.closest("[data-act]"); if(!t) return;
    var a=t.dataset.act;
    if(a==="tab"){ S.tab=t.dataset.id; S.edit=null; S.msg=null;
      S.pad=null; S.gearOpen=null; S.pickOpen=null; S.resetScroll=true;
      return render(); }
    if(a==="export") return exportData();
    if(a==="import") return pickImport();
    if(a==="day"){ S.dayId=t.dataset.id; S.edit=null; S.focus=null; S.doneOpen=false;
      S.pickOpen=null; S.pad=null; S.gearOpen=null;
      S.tab="today"; S.resetScroll=true; return render(); }
    if(a==="focus"){ S.focus=t.dataset.ex; S.edit=null; return render(); }
    if(a==="pickopen"){
      var px=t.dataset.ex;
      S.pickOpen = (S.pickOpen===px) ? null : px;
      S.edit=null; S.pad=null; S.gearOpen=null; return render();
    }
    if(a==="pick"){
      var ps=+t.dataset.slot, pn=t.dataset.n;
      var pbase=baseDay().ex.find(function(x){ return x.slot===ps; });
      var ss2=curSession(true);
      if(!ss2.sw) ss2.sw={};
      ss2.sw[ps]=pn;   // 기본 종목이어도 적어 둔다 (물려받기 해제 표시)
      S.pickOpen=null; S.focus=pn; save();
      return render();
    }
    if(a==="swap"){
      var sl=+t.dataset.slot;
      var cur=day().ex.find(function(x){ return x.slot===sl && !x.out; });
      var opts=slotOptions(sl);
      if(!cur || opts.length<2) return;
      var ni=(opts.indexOf(cur.id)+1)%opts.length;   // 한 번 더 누르면 그다음 후보
      var ss=curSession(true);
      if(!ss.sw) ss.sw={};
      ss.sw[sl]=opts[ni];   // opts[0] 은 기본 종목 — 지우지 말고 적어 둔다
      S.focus=opts[ni]; S.edit=null; save();
      return render();
    }
    if(a==="unswap"){
      var sl2=+t.dataset.slot, s2=curSession(true), b2=baseDay().ex.find(function(x){
        return x.slot===sl2; });
      if(!s2.sw) s2.sw={};
      if(b2) s2.sw[sl2]=b2.id; else delete s2.sw[sl2];
      save();
      S.focus=null; S.edit=null;
      return render();
    }
    if(a==="opendone"){ S.doneOpen=!S.doneOpen; return render(); }
    if(a==="unfocus"){ S.focus=null; S.edit=null; S.pad=null; S.gearOpen=null;
      S.resetScroll=true; return render(); }

    if(a==="excl"){
      var n=t.dataset.n, i=S.excl.indexOf(n);
      if(i>=0) S.excl.splice(i,1); else S.excl.push(n);
      rebuild(); save(); return render();
    }
    if(a==="acc"){ var mg=t.dataset.mg; S.acc[mg]=!S.acc[mg]; return render(); }
    if(a==="aux"){
      var kind=t.dataset.k, ai=+t.dataset.i, s=curSession(true);
      if(!s[kind]) s[kind]={};
      s[kind][ai] = s[kind][ai]?0:1;
      stamp(); save(); return render();
    }
    if(a==="chk"){
      var e=findEx(t.dataset.ex), ci=+t.dataset.i; if(!e) return;
      var arr=ensure(e,ci);
      arr[ci].d = arr[ci].d?0:1;
      S.edit=null; stamp(); save();
      if(!arr[ci].d) return render();
      // 다음 종목으로 자동으로 넘어간다 — 완료된 종목은 접힌다
      if(dn(arr).length>=e.sets && S.focus===e.id) S.focus=null;
      return startRest(restOf(e), e.id);
    }
    if(a==="edit"){
      var e2=findEx(t.dataset.ex), i2=+t.dataset.i; if(!e2) return;
      if(S.edit && S.edit.ex===e2.id && S.edit.i===i2){ S.edit=null; return render(); }
      var arr2=ensure(e2,i2), pl2=planned(e2,i2), p=rx(e2);
      S.draft={w:arr2[i2].w, r:arr2[i2].r,
        lv:(arr2[i2].lv===undefined?null:arr2[i2].lv)};
      S.edit={ex:e2.id, i:i2, sg:{w:(p.w===null?pl2.w:p.w), r:p.r}};
      S.pad=null; S.gearOpen=null;
      return render();
    }
    if(a==="w"){ S.draft.w=Math.max(0, Math.round((S.draft.w+parseFloat(t.dataset.v))*100)/100);
      return render(); }
    if(a==="r"){ S.draft.r=Math.max(1, S.draft.r+parseInt(t.dataset.v,10)); return render(); }
    if(a==="lv"){ var b0=(S.draft.lv===null||S.draft.lv===undefined)?0:S.draft.lv;
      S.draft.lv=Math.max(0, Math.round((b0+parseFloat(t.dataset.v))*10)/10); return render(); }

    // ── 키패드 ──
    if(a==="pad"){ S.pad={k:t.dataset.k, buf:"", i:null, cur:null}; return render(); }
    if(a==="auxlv"){ var ai2=+t.dataset.i;
      S.edit=null; S.pad={k:"wl", buf:"", i:ai2, cur:auxLv(ai2)}; return render(); }
    if(a==="bwpad"){
      S.pad = (S.pad && S.pad.k==="bw") ? null : {k:"bw", buf:"", i:null, cur:S.bw};
      return render();
    }
    if(a==="padk"){
      if(!S.pad) return;
      var v=t.dataset.v, bf=S.pad.buf;
      if(v==="del") bf=bf.slice(0,-1);
      else if(v==="."){ if(bf.indexOf(".")<0) bf=(bf===""?"0":bf)+"."; }
      else if(bf.replace(".","").length<5) bf=(bf==="0"?"":bf)+v;
      S.pad.buf=bf; return render();
    }
    if(a==="padoff"){ S.pad=null; return render(); }
    if(a==="padok"){
      if(!S.pad) return;
      var k=S.pad.k, raw=S.pad.buf, num=parseFloat(raw);
      if(raw==="" || isNaN(num)){ S.pad=null; return render(); }
      num=Math.round(num*100)/100;
      if(k==="wl"){
        var sw=curSession(true);
        if(!sw.wl) sw.wl={};
        sw.wl[S.pad.i]=num;
        S.pad=null; stamp(); save(); return render();
      }
      if(k==="bw"){ S.bw=Math.max(20, Math.min(300, num)); S.pad=null; save(); return render(); }
      if(k==="r") num=Math.max(1, Math.round(num));
      else num=Math.max(0, num);
      S.draft[k]=num; S.pad=null; return render();
    }

    // ── 기구 ──
    if(a==="gear"){ var gx=t.dataset.ex;
      S.gearOpen = (S.gearOpen===gx) ? null : gx; S.edit=null; S.pad=null; return render(); }
    if(a==="gearpick"){ setGear(t.dataset.ex, t.dataset.g); S.gearOpen=null; return render(); }
    if(a==="gearadd"){
      var inp=root.querySelector(".gnew"), nmv=inp?inp.value.trim():"";
      if(!nmv) return;
      setGear(t.dataset.ex, nmv); S.gearOpen=null; return render();
    }
    if(a==="save" || a==="saverest"){
      var o=S.edit; if(!o) return;
      var e3=findEx(o.ex), arr3=ensure(e3,o.i);
      arr3[o.i].w=S.draft.w; arr3[o.i].r=S.draft.r;
      if(e3.ty==="con" && S.draft.lv!==null && S.draft.lv!==undefined) arr3[o.i].lv=S.draft.lv;
      // 아직 안 한 세트에도 같은 값을 밀어 넣는다 — 보통 다음 세트도 같은 무게로 간다
      ensure(e3, e3.sets-1);
      for(var pj=o.i+1;pj<e3.sets;pj++){
        if(arr3[pj] && !arr3[pj].d){
          arr3[pj].w=S.draft.w; arr3[pj].r=S.draft.r;
          if(e3.ty==="con" && S.draft.lv!==null && S.draft.lv!==undefined) arr3[pj].lv=S.draft.lv;
        }
      }
      var wasOpen=!arr3[o.i].d;
      S.edit=null; S.pad=null; stamp(); save();
      // 저장하고 휴식 = 기록 + 체크 + 휴식 시작. 그냥 저장은 값만 남기고
      // 돌고 있는 타이머를 건드리지 않는다.
      if(a==="saverest" && wasOpen){
        arr3[o.i].d=1; save();
        if(dn(arr3).length>=e3.sets && S.focus===e3.id) S.focus=null;
        return startRest(restOf(e3), e3.id);
      }
      return render();
    }
    if(a==="plus30" || a==="minus30"){
      var dlt = a==="plus30" ? 30 : -30;
      var tot = Math.max(15, Math.min(600, S.rest.total+dlt));
      dlt = tot - S.rest.total;
      S.rest.total = tot;
      S.rest.left = Math.max(0, S.rest.left+dlt);
      // 조절한 값을 그 종목의 휴식 시간으로 기억한다
      if(S.rest.ex) setRestOf(S.rest.ex, tot);
      if(S.rest.left<=0){ S.rest.fin=true; clearInterval(tick); tick=null; return render(); }
      S.rest.fin=false;
      if(!tick) startRest(S.rest.left, S.rest.ex); else render();
      return;
    }
    if(a==="endrest") return stopRest();
  });

  (async function(){
    var ex=await get("gym5:excl"), s=await get("gym5:sessions");
    var rt=await get("gym5:rests"), gr=await get("gym5:gears"), bwv=await get("gym5:bw");
    try{ S.excl=ex?JSON.parse(ex):[]; }catch(e){ S.excl=[]; }
    try{ S.sessions=s?JSON.parse(s):[]; }catch(e){ S.sessions=[]; }
    try{ S.rests=rt?JSON.parse(rt):{}; }catch(e){ S.rests={}; }
    try{ S.gears=gr?JSON.parse(gr):{}; }catch(e){ S.gears={}; }
    if(!Array.isArray(S.excl)) S.excl=[];
    if(!Array.isArray(S.sessions)) S.sessions=[];
    if(!S.rests || typeof S.rests!=="object") S.rests={};
    if(!S.gears || typeof S.gears!=="object") S.gears={};
    S.bw = (bwv && !isNaN(parseFloat(bwv))) ? parseFloat(bwv) : null;
    rebuild();
    var k=todayKey(), td=S.sessions.filter(function(x){ return x.date===k; });
    // 오늘 이미 뭔가 기록했으면 그걸 이어서, 아니면 다음 차례 Day 를 띄운다
    S.dayId = td.length ? td[td.length-1].dayId : nextDayId();
    S.ready=true; render();
  })();

  if("serviceWorker" in navigator && location.protocol!=="file:"){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
